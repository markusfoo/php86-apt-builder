name: Build PHP 8.6 Packages (Ubuntu 22.04 / jammy)

# ============================================================================
# DAY-TO-DAY BUILD. Run this every time a new beta/RC drops.
#
# Unlike an earlier version of this pipeline, this workflow never fetches
# or renames anything from Debian's 8.5 packaging, and never mentions
# "8.5". It uses packaging/debian/ as committed in THIS repo (produced
# once by bootstrap-packaging.yml -- see that file's header for why).
# packaging/debian/ already says "php8.6" everywhere; this workflow only
# ever bumps its changelog entry for the new tag being built.
#
# NOTHING HERE TOUCHES YOUR SERVER. Every job runs on GitHub's own
# disposable machines. Your Hestia box is only touched when YOU run
# `apt install` / `apt upgrade` against the repo this produces -- a
# separate, manual, later decision made after you've seen smoke-test pass.
#
# If a new beta needs a packaging change Debian's 8.5-derived tree didn't
# anticipate (new build-dep, renamed extension, changed rules logic), fix
# it directly in packaging/debian/ in this repo and commit it -- that fix
# is then permanent for every future run, the same way Remi Collet's own
# changelog shows him landing one-off upstream-PR fixes into his spec file
# release to release.
#
# ----------------------------------------------------------------------------
# RELIABILITY HARDENING (added after run #3 died as `cancelled` at exactly
# 6h 0m -- GitHub's default hard job timeout -- while stuck inside a plain
# `apt-get update`):
#
#   1. Every job now has an explicit `timeout-minutes`, so a hung step fails
#      fast (minutes, not 6 hours of burned runner time) with a clear log.
#   2. Every job that touches apt drops a persistent apt.conf.d file first,
#      giving Acquire::Retries / Acquire::*::Timeout / ForceIPv4 to every
#      apt call in that job -- including ones you don't call directly, like
#      the apt-get invoked internally by mk-build-deps or add-apt-repository.
#   3. The specific calls most likely to sit on a dead TCP connection
#      (apt-get update, add-apt-repository, git clone) are additionally
#      wrapped in their own `timeout` + small retry loop, as a second line
#      of defense on top of #2.
#   4. Unneeded third-party apt sources preinstalled on GitHub's runner
#      image (google-chrome, azure-cli) are stripped before `apt-get
#      update`, since they are not needed to build PHP and only add extra
#      mirrors that can stall the update.
#   5. `DEBIAN_FRONTEND=noninteractive` is set workflow-wide so no dpkg/
#      debconf prompt can ever silently block a headless runner.
#   6. A `concurrency` group cancels a stale/stuck run automatically the
#      moment you re-dispatch for the same tag, instead of requiring you to
#      cancel it by hand first.
#
# PECL EXTENSIONS (Job 5 - build-pecl):
#   After the PHP packages are compiled, the pipeline automatically builds
#   a set of common PECL extensions (xdebug, redis, igbinary, msgpack, apcu,
#   mongodb, imagick, memcached) against the just-built PHP.  Extensions
#   that fail to compile (e.g. not yet compatible with this PHP version) are
#   skipped with a warning -- the workflow still succeeds.
#   To change the list, edit the EXTENSIONS variable in the build-pecl job.
#
# SMART RELEASE MANAGEMENT (Job 6 - publish):
#   If a GitHub Release for this version tag already exists, new .deb files
#   are UPLOADED to it (existing assets are never deleted).  The release
#   description is automatically updated with a dated entry listing any
#   newly added PECL extensions.  If no release exists, a new one is created
#   with full metadata and a PECL extensions table.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      php_tag:
        description: "Git tag in php/php-src to build"
        type: string
        default: "php-8.6.0beta1"
      target_series:
        description: "PHP series being built -- must match packaging/debian/ (php8.6-*)"
        type: string
        default: "8.6"
      pkg_upstream_version:
        description: "Debian-ordered upstream version string (~ sorts before nothing, so ~beta1 < final)"
        type: string
        default: "8.6.0~beta1"
      pkg_revision:
        description: "Debian package revision suffix"
        type: string
        default: "1"
      publish:
        description: "Create a GitHub Release with .deb packages if build + smoke-test pass"
        type: boolean
        default: true

permissions:
  contents: write   # needed to create GitHub Releases

# Re-dispatching for the same tag/series cancels any run already stuck on
# it, instead of leaving a hung run to burn hours in parallel with the fix.
concurrency:
  group: build-php-${{ github.event.inputs.target_series }}-${{ github.event.inputs.php_tag }}
  cancel-in-progress: true

env:
  DISTRO_CODENAME: jammy   # hardcoded: the only target your Hestia server needs
  PKG: php${{ inputs.target_series }}
  DEBIAN_FRONTEND: noninteractive   # never let a dpkg/debconf prompt block a headless runner

jobs:

  # ==========================================================================
  # JOB 1 -- verify the php-src tag exists, and that packaging/debian/ in
  # this repo actually matches target_series, before doing anything else.
  # ==========================================================================
  resolve:
    name: Resolve inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Confirm php_tag exists in php/php-src
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if timeout 30 git ls-remote --exit-code --tags https://github.com/php/php-src.git "refs/tags/${{ inputs.php_tag }}" >/dev/null; then
              exit 0
            fi
            echo "::warning::git ls-remote attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
          done
          echo "::error::Tag '${{ inputs.php_tag }}' not found in php/php-src (or GitHub was unreachable after 3 attempts)."
          exit 1

      - name: Confirm packaging/debian/ exists and matches target_series
        run: |
          set -euxo pipefail
          test -d packaging/debian || {
            echo "::error::packaging/debian/ not found. Run bootstrap-packaging.yml once first (see its header comment)."
            exit 1
          }
          if ! grep -q "^Package: ${PKG}-" packaging/debian/control; then
            echo "::error::packaging/debian/control has no ${PKG}-* packages. Wrong target_series, or bootstrap wasn't run/merged for this series."
            grep '^Package:' packaging/debian/control || true
            exit 1
          fi
          echo "OK: packaging/debian/ matches ${PKG}."

  # ==========================================================================
  # JOB 2 -- assemble the source tree, bump changelog, validate WITHOUT
  # compiling anything.
  # ==========================================================================
  prepare-and-validate:
    name: Assemble + validate
    needs: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Configure apt for CI reliability (retries, timeouts, IPv4-only)
        run: |
          set -euxo pipefail
          sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ForceIPv4 "true";
          APT::Get::Assume-Yes "true";
          EOF
          # Drop preinstalled third-party sources we don't need for a PHP
          # build -- fewer mirrors to query means fewer chances to stall.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/azure-cli.list
          # Bypass the Azure regional package mirror. GitHub's ubuntu-22.04
          # image resolves the main Ubuntu archive via
          # mirror+file:/etc/apt/apt-mirrors.txt, which tries
          # azure.archive.ubuntu.com first. That mirror is currently
          # slow/unresponsive, so apt-get update stalls past our 60s
          # per-attempt timeout before it ever falls back to the working
          # archive.ubuntu.com host. Point the mirrorlist straight at the
          # canonical archive to skip the stall entirely.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi

      - name: Install packaging toolchain
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 60 apt-get update; then
              break
            fi
            echo "::warning::apt-get update attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update failed after 3 attempts."; exit 1; }
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dpkg-dev equivs quilt \
            git-buildpackage lintian pkg-php-tools re2c bison autoconf ca-certificates

      # Debian's php-team packaging is usually cut against a newer Debian
      # archive than jammy's 2022-era repos ship. ppa:ondrej/php is the
      # same PPA already running php8.5 on your server -- it backports the
      # library versions PHP's build needs, for jammy specifically.
      - name: Add ppa:ondrej/php (backported build-libs for jammy)
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 60 add-apt-repository -y ppa:ondrej/php; then
              break
            fi
            echo "::warning::add-apt-repository attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::add-apt-repository failed after 3 attempts."; exit 1; }
          done
          for attempt in 1 2 3; do
            if sudo timeout 60 apt-get update; then
              break
            fi
            echo "::warning::apt-get update (post-PPA) attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update (post-PPA) failed after 3 attempts."; exit 1; }
          done

      - name: Fetch PHP upstream source and build orig tarball
        run: |
          set -euxo pipefail
          for attempt in 1 2; do
            if timeout 300 git clone --branch "${{ inputs.php_tag }}" --depth 1 https://github.com/php/php-src.git src; then
              break
            fi
            echo "::warning::git clone attempt ${attempt} failed or hung, retrying in 5s..."
            rm -rf src
            sleep 5
            [ "$attempt" -eq 2 ] && { echo "::error::git clone of php-src failed after 2 attempts."; exit 1; }
          done
          rm -rf src/.git
          ORIG_DIR="${PKG}-${{ inputs.pkg_upstream_version }}"
          mv src "$ORIG_DIR"
          tar --sort=name --owner=0 --group=0 -cJf "${PKG}_${{ inputs.pkg_upstream_version }}.orig.tar.xz" "$ORIG_DIR"
          mkdir -p build-area
          mv "${PKG}_${{ inputs.pkg_upstream_version }}.orig.tar.xz" "$ORIG_DIR" build-area/
          cp -r packaging/debian "build-area/${ORIG_DIR}/debian"

      - name: Add changelog entry for this build
        working-directory: build-area/${{ env.PKG }}-${{ inputs.pkg_upstream_version }}
        run: |
          set -euxo pipefail
          export DEBEMAIL="ci@example.com"
          export DEBFULLNAME="Custom PHP CI"
          dch -b --package "$PKG" \
              --newversion "${{ inputs.pkg_upstream_version }}-${{ inputs.pkg_revision }}" \
              --distribution "$DISTRO_CODENAME" --force-distribution \
              "Build of ${{ inputs.php_tag }}."

      # ---- validation stage: catch problems in seconds, not after a 20-40 min compile ----
      - name: Validate build-dependencies resolve
        working-directory: build-area/${{ env.PKG }}-${{ inputs.pkg_upstream_version }}
        run: timeout 120 sudo apt-get build-dep --simulate .

      - name: Validate source package structure
        working-directory: build-area/${{ env.PKG }}-${{ inputs.pkg_upstream_version }}
        run: dpkg-source -b .

      - name: Lint the packaging
        working-directory: build-area
        run: |
          set -euxo pipefail
          # lintian's flag names have shifted across versions -- if this
          # syntax is stale on the runner's installed lintian, check the
          # log; intent is "fail on real errors, allow warnings through".
          lintian --fail-on error ./*.dsc

      - name: Upload prepared + validated source tree
        uses: actions/upload-artifact@v7
        with:
          name: prepared-source
          path: build-area
          if-no-files-found: error
          include-hidden-files: true

  # ==========================================================================
  # JOB 3 -- only runs if validation passed. Actually compiles.
  # ==========================================================================
  build:
    name: Compile .deb packages
    needs: prepare-and-validate
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v7
        with:
          name: prepared-source
          path: build-area

      # actions/upload-artifact -> download-artifact does NOT preserve
      # Unix file permissions (the zip format has no mandatory +x bit).
      # buildconf, configure, debian/rules etc. all lose +x, causing
      # "Permission denied" (exit 126) during dpkg-buildpackage.
      - name: Restore executable permissions lost during artifact round-trip
        run: |
          set -euxo pipefail
          find build-area -type f \( \
            -name 'buildconf' -o \
            -name 'configure' -o \
            -name 'install-sh' -o \
            -name 'mkinstalldirs' -o \
            -name 'libtool' -o \
            -name 'ltmain.sh' -o \
            -name '*.sh' -o \
            -name 'run-tests.php' -o \
            -name 'shtool' -o \
            -name 'config-stubs' -o \
            -name 'gen_stub.php' -o \
            -name 'debian/rules' \
          \) -exec chmod +x {} +
          echo "Restored +x on critical build scripts:"
          find build-area -name 'buildconf' -ls || true
          find build-area -name 'debian/rules' -ls || true

      - name: Configure apt for CI reliability (retries, timeouts, IPv4-only)
        run: |
          set -euxo pipefail
          sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ForceIPv4 "true";
          APT::Get::Assume-Yes "true";
          EOF
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/azure-cli.list
          # Bypass the flaky azure.archive.ubuntu.com mirror -- see comment
          # in the earlier "Configure apt for CI reliability" step.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi

      - name: Install build toolchain
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 60 apt-get update; then
              break
            fi
            echo "::warning::apt-get update attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update failed after 3 attempts."; exit 1; }
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dpkg-dev equivs fakeroot pkg-php-tools re2c bison autoconf

      # The greedy '%:' catch-all rule in debian/rules matches
      # /usr/lib/php/php-common.mk (included via -include) as a make
      # target, causing "dh: error: Unknown sequence" because $@
      # expands to the file path instead of binary/clean/etc.
      # Add an explicit no-op guard rule so make never reaches %:
      # for that path.
      - name: Fix dh Unknown sequence error in debian/rules
        run: |
          set -euxo pipefail
          for rules in build-area/*/debian/rules; do
            if [ -f "$rules" ] && grep -q '^%:' "$rules"; then
              sed -i '/^%:/i /usr/lib/php/php-common.mk: ;' "$rules"
              echo "Patched: $rules - added guard rule for php-common.mk"
            fi
          done

      - name: Add ppa:ondrej/php
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 60 add-apt-repository -y ppa:ondrej/php; then
              break
            fi
            echo "::warning::add-apt-repository attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::add-apt-repository failed after 3 attempts."; exit 1; }
          done
          for attempt in 1 2 3; do
            if sudo timeout 60 apt-get update; then
              break
            fi
            echo "::warning::apt-get update (post-PPA) attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update (post-PPA) failed after 3 attempts."; exit 1; }
          done

      # mk-build-deps / dpkg-buildpackage call apt-get internally; they
      # automatically inherit the Acquire::Retries/Timeout/ForceIPv4
      # settings dropped into /etc/apt/apt.conf.d above, so no extra flags
      # are needed here. Compilation itself is intentionally NOT wrapped in
      # a short `timeout` -- it can legitimately run long; the job-level
      # `timeout-minutes: 120` above is the outer safety net for it.
      - name: Install real build-dependencies and compile
        working-directory: build-area/${{ env.PKG }}-${{ inputs.pkg_upstream_version }}
        run: |
          set -euxo pipefail
          sudo mk-build-deps -ir -t "apt-get -y --no-install-recommends" debian/control
          dpkg-buildpackage -us -uc -b -j"$(nproc)"

      - name: Collect built .deb files
        run: |
          set -euxo pipefail
          mkdir -p debs
          find build-area -maxdepth 1 -name '*.deb' -exec mv {} debs/ \;
          echo "Built $(ls -1 debs/*.deb | wc -l) package(s):"
          ls -lh debs/

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v7
        with:
          name: php-debs
          path: debs/*.deb
          if-no-files-found: error
          include-hidden-files: true

  # ==========================================================================
  # JOB 4 -- only runs if the build succeeded. Proves the packages actually
  # work, in a fresh disposable container -- never on your server.
  # ==========================================================================
  smoke-test:
    name: Install in a clean container and sanity-check
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container: ubuntu:22.04
    # Container jobs default to `sh`, not `bash`, even when the image has
    # bash installed -- this breaks every `set -euxo pipefail` run step
    # below (`sh: 1: set: Illegal option -o pipefail`). Force bash
    # explicitly to match the shell every other job in this workflow gets
    # for free from runs-on: ubuntu-22.04.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this repo (for tests/smoke.sh, if you add one)
        uses: actions/checkout@v5

      - name: Download built .deb files
        uses: actions/download-artifact@v7
        with:
          name: php-debs
          path: debs

      - name: Configure apt for CI reliability (retries, timeouts, IPv4-only)
        run: |
          set -euxo pipefail
          mkdir -p /etc/apt/apt.conf.d
          tee /etc/apt/apt.conf.d/99-ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ForceIPv4 "true";
          APT::Get::Assume-Yes "true";
          EOF

      - name: "Add ppa:ondrej/php (runtime dependency: php-common)"
        # This job runs in a bare `ubuntu:22.04` container, not the
        # GitHub-hosted runner image -- unlike the other two jobs, it has
        # neither `sudo` (irrelevant, we're already root in the container)
        # nor `software-properties-common` (which provides
        # add-apt-repository) preinstalled. Without ppa:ondrej/php here,
        # apt only sees stock Ubuntu's much older `php-common`, which is
        # numerically lower than the `php-common (>= 2:95~)` our packages
        # require -- every php8.6-* package then fails to install with
        # "Depends: php-common (>= 2:95~) but it is not going to be installed".
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if timeout 60 apt-get update; then
              break
            fi
            echo "::warning::apt-get update attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update failed after 3 attempts."; exit 1; }
          done
          apt-get install -y --no-install-recommends software-properties-common gnupg
          for attempt in 1 2 3; do
            if timeout 60 add-apt-repository -y ppa:ondrej/php; then
              break
            fi
            echo "::warning::add-apt-repository attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::add-apt-repository failed after 3 attempts."; exit 1; }
          done
          for attempt in 1 2 3; do
            if timeout 60 apt-get update; then
              break
            fi
            echo "::warning::apt-get update (post-PPA) attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update (post-PPA) failed after 3 attempts."; exit 1; }
          done

      - name: "Add PGDG apt repository (runtime dependency: libpq5 >= 17~)"
        # The `build` job runs directly on the `ubuntu-22.04` GitHub-hosted
        # runner, whose image ships a preinstalled, much newer PostgreSQL
        # client toolchain than what's in Ubuntu jammy's own repos. That's
        # what php8.6-pgsql actually links against, so dh_shlibdeps records
        # "Depends: libpq5 (>= 17~)" in the built package.
        #
        # This job, in contrast, runs inside a bare `ubuntu:22.04` container,
        # which only has jammy's stock libpq5 (14.x) -- and ppa:ondrej/php
        # doesn't carry libpq5 either, that's the Postgres team's package,
        # not the PHP team's. Without the official PGDG apt repo here, apt
        # can't satisfy that >= 17~ requirement and php8.6-pgsql fails to
        # install with "Depends: libpq5 (>= 17~~) but it is not going to be
        # installed".
        run: |
          set -euxo pipefail
          apt-get install -y --no-install-recommends postgresql-common
          for attempt in 1 2 3; do
            if timeout 60 /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y; then
              break
            fi
            echo "::warning::PGDG repo setup attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::PGDG repo setup failed after 3 attempts."; exit 1; }
          done
          for attempt in 1 2 3; do
            if timeout 60 apt-get update; then
              break
            fi
            echo "::warning::apt-get update (post-PGDG) attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update (post-PGDG) failed after 3 attempts."; exit 1; }
          done

      - name: Install and run checks
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if timeout 60 apt-get update; then
              break
            fi
            echo "::warning::apt-get update attempt ${attempt} failed or hung, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update failed after 3 attempts."; exit 1; }
          done
          apt-get install -y --no-install-recommends ./debs/*.deb || apt-get -f install -y
          php${{ inputs.target_series }} -v
          php${{ inputs.target_series }} -m
          if command -v php${{ inputs.target_series }}-fpm >/dev/null 2>&1; then
            php${{ inputs.target_series }}-fpm -t
          fi
          # Add tests/smoke.sh to this repo to check your own two products
          # here -- it runs automatically if present, before anything publishes.
          if [ -x tests/smoke.sh ]; then ./tests/smoke.sh; fi

  # ==========================================================================
  # JOB 5 -- builds PECL extensions against the just-compiled PHP 8.6.
  # Runs in parallel with smoke-test (both depend only on the build job).
  # Extensions that fail to compile (e.g. not yet compatible with 8.6)
  # are skipped with a warning -- the workflow still succeeds.
  #
  # To add/remove extensions, edit the EXTENSIONS list below.
  # ==========================================================================
  build-pecl:
    name: Build PECL extension packages
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Download built PHP .deb files
        uses: actions/download-artifact@v7
        with:
          name: php-debs
          path: debs

      - name: Configure apt for CI reliability
        run: |
          set -euxo pipefail
          sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ForceIPv4 "true";
          APT::Get::Assume-Yes "true";
          EOF
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/azure-cli.list
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi

      - name: Add repositories and install PHP + PECL build dependencies
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 60 apt-get update; then break; fi
            echo "::warning::apt-get update attempt ${attempt} failed, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update failed"; exit 1; }
          done
          sudo apt-get install -y --no-install-recommends software-properties-common gnupg
          for attempt in 1 2 3; do
            if sudo timeout 60 add-apt-repository -y ppa:ondrej/php; then break; fi
            echo "::warning::add-apt-repository attempt ${attempt} failed, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::add-apt-repository failed"; exit 1; }
          done
          sudo apt-get install -y --no-install-recommends postgresql-common
          for attempt in 1 2 3; do
            if sudo timeout 60 /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y; then break; fi
            echo "::warning::PGDG setup attempt ${attempt} failed, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::PGDG setup failed"; exit 1; }
          done
          for attempt in 1 2 3; do
            if sudo timeout 60 apt-get update; then break; fi
            echo "::warning::apt-get update (post-repo) attempt ${attempt} failed, retrying in 5s..."
            sleep 5
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update failed"; exit 1; }
          done
          # Install the PHP packages we just built (provides phpize, headers, php-config)
          sudo dpkg -i ./debs/*.deb || sudo apt-get -f install -y
          # PECL extension build dependencies
          sudo apt-get install -y --no-install-recommends \
            checkinstall pear \
            libmagickwand-dev libmagickcore-dev \
            libmemcached-dev zlib1g-dev \
            libmongoc-dev libbson-dev \
            libssl-dev libcurl4-openssl-dev

      - name: Build PECL extensions
        run: |
          set -uo pipefail

          # ------------------------------------------------------------------
          # PECL extensions to build.  Add or remove names here; the rest of
          # the script handles download, compile, and .deb packaging.
          # ------------------------------------------------------------------
          EXTENSIONS="xdebug redis igbinary msgpack apcu mongodb imagick memcached"

          SERIES="${{ inputs.target_series }}"
          OUT_DIR="pecl-builds"
          mkdir -p "$OUT_DIR"

          for EXT in $EXTENSIONS; do
            echo "::group::$EXT"
            WORK=$(mktemp -d)
            cd "$WORK"

            # --- download ---
            if ! pecl download "$EXT" 2>/dev/null; then
              echo "::warning::pecl download failed for $EXT (may not exist or network issue)"
              rm -rf "$WORK"; echo "::endgroup::"; continue
            fi

            ARCHIVE=$(ls -t "${EXT}"-*.tgz 2>/dev/null | head -1)
            [ -z "$ARCHIVE" ] && { rm -rf "$WORK"; echo "::endgroup::"; continue }

            # --- version from filename: redis-6.1.0.tgz -> 6.1.0 ---
            EXT_VER=$(echo "$ARCHIVE" | sed -n "s/^${EXT}-\(.*\)\\.tgz$/\\1/p")
            [ -z "$EXT_VER" ] && EXT_VER="0.0.0"

            tar xzf "$ARCHIVE"
            BDIR=$(ls -d "${EXT}"-* 2>/dev/null | head -1)
            [ -z "$BDIR" ] || [ ! -d "$BDIR" ] && {
              echo "::warning::No build directory for $EXT"
              rm -rf "$WORK"; echo "::endgroup::"; continue
            }
            cd "$BDIR"

            # --- phpize ---
            PHPIZE="phpize${SERIES}"
            PCONF="/usr/bin/php-config${SERIES}"
            [ ! -x "$PCONF" ] && PCONF="/usr/bin/php-config"

            if ! "$PHPIZE" >/dev/null 2>&1; then
              echo "::warning::phpize failed for $EXT"
              cd /; rm -rf "$WORK"; echo "::endgroup::"; continue
            fi

            # --- configure ---
            CONF_EXTRA=""
            case "$EXT" in
              imagick)   CONF_EXTRA="--with-imagick" ;;
              memcached) CONF_EXTRA="--disable-memcached-sasl" ;;
            esac

            if ! ./configure --with-php-config="$PCONF" $CONF_EXTRA >/dev/null 2>&1; then
              echo "::warning::configure failed for $EXT"
              cd /; rm -rf "$WORK"; echo "::endgroup::"; continue
            fi

            # --- compile ---
            if ! make -j"$(nproc)" >/dev/null 2>&1; then
              echo "::warning::make failed for $EXT (not yet compatible with PHP ${SERIES}?)"
              cd /; rm -rf "$WORK"; echo "::endgroup::"; continue
            fi

            # --- package as .deb via checkinstall ---
            if sudo checkinstall -D \
              --pkgname="php${SERIES}-${EXT}" \
              --pkgversion="$EXT_VER" \
              --pkgrelease="1" \
              --maintainer="markusfoo" \
              --pkgsource="PECL" \
              --pkggroup="php" \
              --nodoc \
              --fstrans=no \
              --backup=no \
              -y make install >/dev/null 2>&1; then

              CREATED=$(ls -t *.deb 2>/dev/null | head -1 || true)
              if [ -n "$CREATED" ] && [ -f "$CREATED" ]; then
                mv "$CREATED" "${OUT_DIR}/"
                echo "  Built: $(basename "$CREATED")"
              else
                echo "::warning::checkinstall succeeded but no .deb found for $EXT"
              fi
            else
              echo "::warning::checkinstall failed for $EXT"
            fi

            cd /
            rm -rf "$WORK"
            echo "::endgroup::"
          done

          echo ""
          echo "=== PECL Build Summary ==="
          if ls "$OUT_DIR"/*.deb 1>/dev/null 2>&1; then
            echo "Successfully built $(ls "$OUT_DIR"/*.deb | wc -l) PECL extension package(s):"
            ls -lh "$OUT_DIR"/
          else
            echo "No PECL extensions were successfully built."
          fi

      - name: Upload PECL .deb artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pecl-debs
          path: pecl-builds/*.deb
          if-no-files-found: warn
          include-hidden-files: true

  # ==========================================================================
  # JOB 6 -- publishes .deb packages to a GitHub Release.
  #
  # SMART RELEASE MANAGEMENT:
  #   - If a release for this VERSION_TAG already exists, new .deb files
  #     are UPLOADED to it (existing assets are kept). The release body
  #     is updated with a dated entry listing any newly added PECL
  #     extensions.
  #   - If no release exists yet, a new one is created with full metadata
  #     and a PECL extensions table.
  #   - Beta/RC/alpha versions are automatically marked as pre-release.
  # ==========================================================================
  publish:
    name: Publish to GitHub Release
    needs: [smoke-test, build-pecl]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Download PHP .deb files
        uses: actions/download-artifact@v7
        with:
          name: php-debs
          path: php-debs

      - name: Download PECL .deb files (if any)
        uses: actions/download-artifact@v7
        with:
          name: pecl-debs
          path: pecl-debs
        continue-on-error: true

      - name: Upsert GitHub Release with .deb packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          SAFE_VERSION=$(echo "${{ inputs.pkg_upstream_version }}" | tr '~' '-')
          VERSION_TAG="php${{ inputs.target_series }}-v${SAFE_VERSION}-${{ inputs.pkg_revision }}"
          RELEASE_NAME="PHP ${{ inputs.target_series }} ${{ inputs.pkg_upstream_version }}-${{ inputs.pkg_revision }}"
          SERIES="${{ inputs.target_series }}"

          # -----------------------------------------------------------------
          # Pre-release flag
          # -----------------------------------------------------------------
          if echo "${{ inputs.pkg_upstream_version }}" | grep -qE '(alpha|beta|rc|~)'; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi

          # -----------------------------------------------------------------
          # Build PECL extensions table (for new-release body)
          # -----------------------------------------------------------------
          PECL_TABLE=""
          if [ -d "pecl-debs" ] && ls pecl-debs/*.deb 1>/dev/null 2>&1; then
            PECL_TABLE=$(printf '| Extension | Version |\n|---|---|\n')
            for deb in pecl-debs/*.deb; do
              BN=$(basename "$deb" .deb)
              EN=$(echo "$BN" | sed "s/^php${SERIES}-//;s/_.*//")
              EV=$(echo "$BN" | sed "s/^php${SERIES}-[^_]*_//;s/_amd64//")
              PECL_TABLE="${PECL_TABLE}| ${EN} | \`${EV}\` |\n"
            done
          fi

          # -----------------------------------------------------------------
          # Check if a release for this tag already exists
          # -----------------------------------------------------------------
          RELEASE_EXISTS=false
          EXISTING_ASSETS=""
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            EXISTING_ASSETS=$(gh release view "$VERSION_TAG" --json assets -q '.assets[].name' 2>/dev/null | sort)
          fi

          # -----------------------------------------------------------------
          # Collect only the NEW .deb files (not yet in the release)
          # -----------------------------------------------------------------
          NEW_DEBS=()
          NEW_PECL=""

          # PECL extensions first
          for deb in pecl-debs/*.deb; do
            [ -f "$deb" ] || continue
            DN=$(basename "$deb")
            if echo "$EXISTING_ASSETS" | grep -qF "$DN"; then
              echo "  skip (already uploaded): $DN"
            else
              NEW_DEBS+=("$deb")
              BN=$(basename "$DN" .deb)
              EN=$(echo "$BN" | sed "s/^php${SERIES}-//;s/_.*//")
              EV=$(echo "$BN" | sed "s/^php${SERIES}-[^_]*_//;s/_amd64//")
              NEW_PECL="${NEW_PECL}| ${EN} | \`${EV}\` |\n"
              echo "  new PECL: $DN"
            fi
          done

          # PHP core packages
          for deb in php-debs/*.deb; do
            [ -f "$deb" ] || continue
            DN=$(basename "$deb")
            if echo "$EXISTING_ASSETS" | grep -qF "$DN"; then
              echo "  skip (already uploaded): $DN"
            else
              NEW_DEBS+=("$deb")
              echo "  new PHP: $DN"
            fi
          done

          if [ "${#NEW_DEBS[@]}" -eq 0 ]; then
            echo "::notice::All packages already present in release $VERSION_TAG -- nothing to upload."
            exit 0
          fi

          echo "Uploading ${#NEW_DEBS[@]} new package(s) to release $VERSION_TAG"

          # -----------------------------------------------------------------
          # Create or update the release
          # -----------------------------------------------------------------
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$RELEASE_EXISTS" = true ]; then
            # --- UPDATE existing release ---
            gh release upload "$VERSION_TAG" "${NEW_DEBS[@]}"

            if [ -n "$NEW_PECL" ]; then
              gh release view "$VERSION_TAG" --json body -q '.body' > /tmp/current-body.md
              printf -- '\n---\n\n### Added %s (run #%s)\n\n| Extension | Version |\n|---|---|\n%s' \
                "$TODAY" "$GITHUB_RUN_NUMBER" "$NEW_PECL" >> /tmp/current-body.md
              gh release edit "$VERSION_TAG" --notes-file /tmp/current-body.md
              echo "::notice::Updated release $VERSION_TAG with new PECL extensions"
            else
              echo "::notice::Uploaded packages to existing release $VERSION_TAG"
            fi
          else
            # --- CREATE new release ---
            cat > /tmp/release-notes.md <<NOTES_EOF
          ## PHP ${{ inputs.target_series }} Build

          | | |
          |---|---|
          | **Source tag** | \`${{ inputs.php_tag }}\` |
          | **Version** | \`${{ inputs.pkg_upstream_version }}-${{ inputs.pkg_revision }}\` |
          | **Distro** | Ubuntu 22.04 (jammy) / amd64 |
          | **Workflow run** | [#$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |
          NOTES_EOF

            if [ -n "$PECL_TABLE" ]; then
              printf -- '\n### PECL Extensions\n\n%s' "$PECL_TABLE" >> /tmp/release-notes.md
            fi

            cat >> /tmp/release-notes.md <<'INSTALL_EOF'

          ### Installation

          Download all .\*.deb files from the Assets below, then:

          \`\`\`bash
          sudo dpkg -i php*.deb
          sudo apt-get -f install
          \`\`\`

          Or download individually and install the packages you need.
          INSTALL_EOF

            gh release create "$VERSION_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file /tmp/release-notes.md \
              ${PRERELEASE_FLAG} \
              "${NEW_DEBS[@]}"
          fi

          echo "::notice::Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION_TAG"
